# ARK over HTTPS (needed for installing as a PWA).
#   sudo cp deploy/nginx-ark.conf /etc/nginx/sites-available/ark
#   sudo ln -s /etc/nginx/sites-available/ark /etc/nginx/sites-enabled/ark
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates come from scripts/make-certs.sh.

# Plain HTTP on port 80: http://ark.local/ opens the app (no :8000 needed), and anything a phone
# probes while checking for internet (captive.apple.com, connectivitycheck.gstatic.com,
# msftconnecttest.com...) is redirected to the welcome page. That is what makes the
# "Sign in to network" pop-up appear when someone joins the ARK Wi-Fi.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 500m;

    # Not our own address (IP, localhost, ark, ark.local)? Send to the welcome page.
    if ($host !~* "^([0-9.]+|localhost|[a-z0-9-]+(\.local)?)$") {
        return 302 http://10.42.0.1/welcome;
    }

    location /kiwix/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
    location /maps/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ark-tls/server.crt;
    ssl_certificate_key /etc/ark-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    # Offline Wikipedia & friends (kiwix-serve on 127.0.0.1:8082 with --urlRootLocation=/kiwix)
    location /kiwix/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }

    # Map tiles are big range requests; don't buffer them.
    location /maps/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Plain-HTTP access to the Kiwix libraries on the old port: http://<host>:8081/
server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    location = / { return 302 /kiwix/; }
    location /kiwix/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
    location / { return 302 /kiwix/; }
}
